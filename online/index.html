<title>鱼虾蟹 · 骰运星河</title>

<script>window.__V="__V__";</script>
<style>
  html,body{margin:0;height:100%;background:#10060c}
  .login-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:#10060c url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABQODxIPDRQSEBIXFRQYHjIhHhwcHj0sLiQySUBMS0dARkVQWnNiUFVtVkVGZIhlbXd7gYKBTmCNl4x9lnN+gXz/2wBDARUXFx4aHjshITt8U0ZTfHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHz/wAARCABOACQDASIAAhEBAxEB/8QAGgABAAIDAQAAAAAAAAAAAAAAAAMFAQIEBv/EACAQAAICAgICAwAAAAAAAAAAAAABAgMEEQUSIUEjMVH/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/xAAaEQACAwEBAAAAAAAAAAAAAAAAAQIDERIT/9oADAMBAAIRAxEAPwDxoAAAAAAAAANtG8IpmNFhh4jtg3oiUlFaylHStktM1J8itwsaZDopPUJrDUG2gMRLXByktI9PxdXSh9l6OGnFhW03otaJxUNI8++zpYjrhDCh5Kr529HA46PTZOMrvJwWca/OjSu5ZjIlWymaBPZjuE2gdPSMcJI5c2vLJI504+yuUtGe5DrRorGW0eUkvslXLJrTKPsYbJ8Isfoy0sya5zcv0FVtgryRHYABsQAAAAAAB//Z") center/cover no-repeat}

<body>

<!-- ============ 登录页（Pha That Luang 夜景，CC BY-SA 3.0） ============ -->
<section id="login" class="login">
  <div class="login-bg" aria-hidden="true">
    <img id="loginBg" src="/o/img/login-bg.webp?v=__V__" alt="" width="1854" height="4012" fetchpriority="high" onload="this.classList.add('ready')">
  </div>
  <script>!function(i){if(i&&i.complete&&i.naturalWidth)i.classList.add('ready')}(document.getElementById('loginBg'))</script>
  <div class="login-wash" aria-hidden="true"></div>
  <canvas id="dust"></canvas>
  <button id="loginMusic" class="music-btn gold" aria-label="音乐"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
  <div class="login-inner">
    <div class="login-hero">
    <h1 class="t-title">鱼虾蟹</h1>
    <div class="lotus">
      <i class="ln l"></i>
      <svg viewBox="0 0 120 70"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dc95"/><stop offset=".55" stop-color="#c9923a"/><stop offset="1" stop-color="#7a4f16"/></linearGradient></defs>
        <g fill="url(#lg)" stroke="#5a3a0f" stroke-width=".6">
          <path d="M60 6 C68 20 68 38 60 52 C52 38 52 20 60 6Z"/>
          <path d="M60 52 C48 44 40 30 41 16 C50 24 57 38 60 52Z"/><path d="M60 52 C72 44 80 30 79 16 C70 24 63 38 60 52Z"/>
          <path d="M60 54 C42 52 28 42 24 30 C38 32 52 42 60 54Z"/><path d="M60 54 C78 52 92 42 96 30 C82 32 68 42 60 54Z"/>
          <path d="M60 56 C44 58 26 54 16 46 C32 44 48 48 60 56Z"/><path d="M60 56 C76 58 94 54 104 46 C88 44 72 48 60 56Z"/>
          <path d="M44 58 Q60 66 76 58 L72 63 Q60 68 48 63Z"/>
        </g></svg>
      <i class="ln r"></i>
    </div>
    </div>
    <form id="authForm" class="t-panel" autocomplete="on">
      <label class="t-field"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input id="fUser" name="username" placeholder="用户名" autocomplete="username" maxlength="16" required></label>
      <label class="t-field"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="fPass" name="password" type="password" placeholder="密码" autocomplete="current-password" maxlength="32" required><button type="button" class="eye" id="eye" aria-label="显示密码"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
      <label class="t-field" id="pass2Row" hidden><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="fPass2" type="password" placeholder="确认密码" autocomplete="new-password" maxlength="32"></label>
      <div class="t-switch" id="authSwitch"><button type="button" class="on" data-m="login">登录</button><span>·</span><button type="button" data-m="register">注册</button></div>
      <div class="t-err" id="authErr"></div>
      <button class="t-btn" id="authBtn" type="submit"><span>登录并进入</span></button>
      <div class="t-tip" id="authTip">新注册账号赠送 10,000 演示币 · 虚拟游戏币，不可充值或兑换</div>
    </form>
    <div id="welcome" class="t-panel welcome" hidden>
      <div class="w-txt">欢迎回来 <b id="wName"></b></div>
      <button class="t-btn" id="enterBtn" type="button"><span>进入大厅</span></button>
      <button class="t-link" id="switchUser" type="button">切换账号</button>
    </div>
    <a class="login-credit" href="https://commons.wikimedia.org/wiki/File:PhaThatLuang_Afterdark.jpg" target="_blank" rel="noopener noreferrer">Pha That Luang · שמעון שוואעי · CC BY-SA 3.0</a>
  </div>
</section>

<!-- ============ 大厅（单人局 · 斜坡拉绳放骰） ============ -->
<section id="lobby" class="lobby" hidden>
  <div class="hud-bg"></div>
  <div class="wrap">
    <header class="hud-top">
      <div class="me">
        <div class="ava"><svg viewBox="0 0 64 64"><defs><radialGradient id="hg" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#9ff6ff"/><stop offset=".5" stop-color="#1e6f9a"/><stop offset="1" stop-color="#071a2a"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="#07141f"/><path d="M14 58c2-12 10-17 18-17s16 5 18 17z" fill="#c8d3df"/><circle cx="32" cy="27" r="15" fill="#e8eef5"/><ellipse cx="32" cy="28" rx="11" ry="9" fill="url(#hg)"/><path d="M24 24q8-6 16 0" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/></svg><span class="lv">LV.28</span></div>
        <div class="me-info"><div class="me-name" id="meName">玩家</div><div class="me-sub">★ <span id="round">第 - 局</span></div></div>
      </div>
      <div class="title-plate"><svg viewBox="0 0 24 24"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg><span>骰运星河 · 鱼虾蟹</span></div>
      <div class="top-right"><div class="bal"><i class="coin"></i><b id="balance">0</b></div></div>
      <button id="lobbyMusic" class="music-btn cyan" aria-label="音乐"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    </header>

    <section class="stage" id="stage">
      <div class="slope"><i class="back-lip"></i><i class="rail l"><i class="gold"></i></i><i class="rail r"><i class="gold"></i></i></div>
      <i class="post tl"></i><i class="post tr"></i><i class="post jl"></i><i class="post jr"></i><i class="post fl"></i><i class="post fr"></i>
      <div class="seam"></div>
      <div class="flat"><i class="felt"></i><i class="spot"></i><i class="reflect"></i><i class="ring" id="ring"></i></div>
      <div class="bar" id="bar"><i class="knot"></i></div>
      <div id="dice"></div>
      <div id="fx"></div>
      <div class="win3d" id="win3d"></div>
      <div class="rope" id="rope"><i class="rope-line"></i><div class="handle" id="handle"><i></i></div></div>
      <svg class="arrow" id="pullHint" viewBox="0 0 36 36"><path d="M18 4v20" /><path d="M8 18 L18 30 L28 18" /></svg>
      <div class="result-pop" id="resultPop"></div>
    </section>

    <div class="bottom">
      <section class="board" id="board"></section>
      <div class="chips" id="chips"></div>
      <div class="actions">
        <button class="act act-clear" id="btnClear"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>取消下注</button>
      </div>
      <nav class="bnav">
        <button class="on"><svg viewBox="0 0 24 24"><path d="M12 2 21 7v10l-9 5-9-5V7z"/></svg>骰子投注</button>
        <button id="navHist"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>开奖历史</button>
        <button id="navFair"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>规则说明</button>
        <button id="navMenu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      </nav>
    </div>
  </div>
</section>

<div id="sheet" class="sheet" hidden><div class="sheet-box"><button class="sheet-x" id="sheetX">✕</button><div id="sheetBody"></div></div></div>
<div id="toast"></div>
<script src="/o/sound.js?v=__V__"></script>
<script src="/o/app.js?v=__V__"></script>
</body>
</html>
