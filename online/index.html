<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#062221">
<title>鱼虾蟹 · 在线试玩</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="online.css">
</head>
<body>
<div id="sprite"></div>

<!-- 启动页 -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-dice">
      <div class="mini-die"><svg viewBox="0 0 100 100"><use href="#s-carp"/></svg></div>
      <div class="mini-die"><svg viewBox="0 0 100 100"><use href="#s-elephant"/></svg></div>
      <div class="mini-die"><svg viewBox="0 0 100 100"><use href="#s-rabbit"/></svg></div>
    </div>
    <h1 class="logo">鱼虾蟹</h1>
    <div class="logo-sub">LUCKY DICE · 在线试玩</div>
    <div class="loadbar" id="loadbarWrap"><i id="loadfill"></i></div>
    <div id="loadtxt" class="loadtxt">连接服务器…</div>
    <form id="authForm" class="auth" hidden autocomplete="on">
      <div class="auth-tabs"><button type="button" class="on" data-m="login">登录</button><button type="button" data-m="register">注册</button></div>
      <input id="fUser" name="username" placeholder="用户名（3-16位）" autocomplete="username" maxlength="16" required>
      <input id="fPass" name="password" type="password" placeholder="密码（6-32位）" autocomplete="current-password" maxlength="32" required>
      <input id="fPass2" type="password" placeholder="确认密码" autocomplete="new-password" maxlength="32" hidden>
      <div class="auth-err" id="authErr"></div>
      <button class="enter-btn" id="authBtn" type="submit">登录并进入</button>
      <div class="auth-tip">新注册账号赠送 10,000 演示币</div>
    </form>
    <div id="welcome" hidden>
      <div class="loadtxt">欢迎回来，<b id="wName"></b></div>
      <button id="enterBtn" class="enter-btn">点击进入游戏</button>
      <div><button class="link-btn" id="switchUser" type="button">切换账号</button></div>
    </div>
    <div class="demo-note">仅限娱乐演示 · 虚拟游戏币 · 不可充值或兑换</div>
  </div>
</div>

<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="me">
      <div class="avatar"><svg viewBox="0 0 100 100"><use href="#s-avatar"/></svg><span class="lv">28</span></div>
      <div class="me-info">
        <div class="me-name" id="meName">玩家</div>
        <div class="balance"><i class="coin"></i><span id="balance">10,000</span></div>
      </div>
    </div>
    <div class="round-box">
      <div class="round">第 <b id="roundNo">1</b> 回合</div>
      <div class="round-timer" id="topTimer">00:15</div>
    </div>
    <div class="top-right">
      <div class="online"><i class="dot"></i><div><small>在线玩家</small><b id="online">2,458</b></div></div>
      <button id="musicBtn" class="icon-btn" aria-label="音乐">♪</button>
    </div>
  </header>

  <!-- 开奖舞台 -->
  <section class="stage" id="stage">
    <div class="rays" id="rays"></div>
    <canvas id="fx"></canvas>
    <div class="stage-head">
      <div class="stage-title" id="stageTitle">请下注</div>
      <div class="stage-timer" id="stageTimer">00:15</div>
    </div>
    <div class="dice-area" id="diceArea">
      <div class="die-wrap" data-d="0"><div class="cube"></div><div class="shadow"></div></div>
      <div class="die-wrap" data-d="1"><div class="cube"></div><div class="shadow"></div></div>
      <div class="die-wrap" data-d="2"><div class="cube"></div><div class="shadow"></div></div>
      <div class="ring" id="ring"></div>
    </div>
    <div class="flash" id="flash"></div>
    <div class="banner" id="banner"></div>
    <div class="result-pop" id="resultPop"></div>
    <ul class="feed" id="feed"></ul>
  </section>

  <!-- 近期开奖 -->
  <div class="history">
    <span class="h-label">近期开奖</span>
    <div class="h-list" id="history"></div>
  </div>

  <!-- 下注区 -->
  <section class="board" id="board"></section>

  <!-- 筹码 -->
  <div class="chips" id="chips"></div>

  <!-- 操作 -->
  <div class="actions">
    <button class="act act-clear" id="btnClear"><span>🗑</span>清空</button>
    <button class="act act-repeat" id="btnRepeat"><span>⟳</span>重复</button>
    <button class="act act-ok" id="btnOk"><span>✔</span>确认</button>
  </div>
  <div class="foot-note"><span id="conn" class="conn">●</span> 在线大厅 · 虚拟游戏币 · 1个中1赔1，2个中1赔2，3个中1赔3</div>
</div>

<div id="toast"></div>

<script src="symbols.js"></script>
<script src="audio.js"></script>
<script src="online.js"></script>
</body>
</html>
