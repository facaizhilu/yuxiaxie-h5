services:
  - type: web
    name: yuxiaxie-h5
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TEST_USER
        value: test01
      - key: TEST_USERS
        value: test01,test02,test03,test04,test05
      - key: TEST_PASS
        sync: false
      - key: TEST_BALANCE
        value: "1000000"
